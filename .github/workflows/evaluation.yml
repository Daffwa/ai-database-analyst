name: Evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read

jobs:
  deterministic-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.14
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Bootstrap the pinned verified SQLite fixture
        run: uv run python scripts/dev.py data-setup
      - name: Prove live PostgreSQL integration
        run: uv run python scripts/dev.py test-postgres
      - name: Run Stage 7 and Stage 8 evaluations
        run: |
          uv run python scripts/dev.py evaluate-stage7
          uv run python scripts/dev.py evaluate-stage8
      - name: Upload privacy-minimized evaluation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deterministic-evaluation
          path: |
            reports/evaluation/stage-7-regression.json
            reports/evaluation/stage-8-readiness.json
            reports/test-results/stage-8-postgres.json
          retention-days: 30
