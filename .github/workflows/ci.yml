name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Synchronize locked development environment
        run: uv sync --frozen --extra dev
      - name: Bootstrap the pinned verified SQLite fixture
        run: uv run python scripts/dev.py data-setup
      - name: Run deterministic quality gate
        run: uv run python scripts/dev.py verify
      - name: Export coverage XML
        if: matrix.python-version == '3.12'
        run: uv run coverage xml -o coverage.xml
      - name: Upload coverage evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-3.12
          path: coverage.xml
          retention-days: 14

  postgresql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.11.14
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Run actual PostgreSQL and API integration gate
        run: uv run python scripts/dev.py test-postgres
      - name: Upload PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-8-postgresql
          path: reports/test-results/stage-8-postgres.json
          retention-days: 14
