name: ai-database-analyst

x-api-environment: &api-environment
  APP_ENV: production
  APP_LOG_LEVEL: INFO
  ANALYTICS_DATABASE_URL: postgresql+psycopg://analytics_readonly:${STAGE8_ANALYTICS_PASSWORD:?run generate-compose-env}@db:5432/chinook
  METADATA_DATABASE_URL: postgresql+psycopg://app_metadata_user:${STAGE8_METADATA_PASSWORD:?run generate-compose-env}@db:5432/analyst_metadata
  ANALYTICS_SCHEMA: analytics
  METADATA_SCHEMA: app_metadata
  SQL_DIALECT: postgres
  PROMPT_VERSION: v2
  SEMANTIC_VERSION: v1-postgresql
  LLM_PROVIDER: fake
  LLM_MODEL: fake-deterministic
  EVALUATION_API_TOKEN: ${EVALUATION_API_TOKEN:?run generate-compose-env}
  CORS_ALLOWED_ORIGINS: '["http://localhost:${FRONTEND_PUBLISHED_PORT:-8501}"]'

services:
  db:
    image: postgres:17.10-alpine3.24@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?run generate-compose-env}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      STAGE8_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres:${POSTGRES_ADMIN_PASSWORD:?run generate-compose-env}@db:5432/postgres
      STAGE8_ANALYTICS_PASSWORD: ${STAGE8_ANALYTICS_PASSWORD:?run generate-compose-env}
      STAGE8_METADATA_PASSWORD: ${STAGE8_METADATA_PASSWORD:?run generate-compose-env}
      STAGE8_MIGRATION_PASSWORD: ${STAGE8_MIGRATION_PASSWORD:?run generate-compose-env}
    command: ["python", "-m", "scripts.bootstrap_postgres"]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, egress]
    restart: "no"

  api:
    image: ai-database-analyst-api:local
    build:
      context: .
      dockerfile: Dockerfile.api
    environment: *api-environment
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PUBLISHED_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks: [backend, frontend]
    read_only: true
    tmpfs: [/tmp]
    init: true
    restart: unless-stopped

  frontend:
    image: ai-database-analyst-frontend:local
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      APP_ENV: production
      API_BASE_URL: http://api:8000
      API_TIMEOUT_SECONDS: 15
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PUBLISHED_PORT:-8501}:8501"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks: [frontend, backend]
    read_only: true
    tmpfs: [/tmp]
    init: true
    restart: unless-stopped

networks:
  backend:
    internal: true
  egress: {}
  frontend: {}

volumes:
  postgres-data: {}
