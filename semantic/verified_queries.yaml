  - query_id: total_revenue
    questions:
      id: ["Berapa total nilai seluruh invoice?"]
      en: ["What is the total value of all invoices?"]
    sql: SELECT ROUND(SUM(Total), 2) AS total_invoice_value FROM Invoice
    tables: [Invoice]
    columns: [Invoice.Total]
    metric_ids: [total_revenue]
    tags: [revenue, invoice, aggregate]
    expected_result_sha256: 1aa3818bf795ecaaf80bc052f1c705a636c9b96e8c7b36fe4db53d9e6c700444
    status: valid
    review_status: project_verified
    source_refs: [backend/evaluation/mini_cases.py]

  - query_id: average_invoice_value
    questions:
      id: ["Berapa rata-rata nilai invoice?"]
      en: ["What is the average invoice value?"]
    sql: SELECT ROUND(AVG(Total), 2) AS average_invoice_value FROM Invoice
    tables: [Invoice]
    columns: [Invoice.Total]
    metric_ids: [average_invoice_value]
    tags: [invoice, average]
    expected_result_sha256: 16c1103e8f3703d7cd6a5914e1c6bc2e9751db6d0d0a7d2b5e87b73568a6dfc1
