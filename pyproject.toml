[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-database-analyst"
version = "0.1.0"
description = "Security-first conversational analytics over relational databases."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
authors = [
  { name = "AI Database Analyst contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "alembic==1.18.5",
  "altair==6.2.2",
  "fastapi==0.139.2",
  "gitpython==3.1.55",
  "httpx==0.28.1",
  "numpy==2.4.6",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "pyyaml==6.0.3",
  "sqlalchemy==2.0.51",
  "sqlglot==30.14.0",
  "streamlit==1.60.0",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "httpx2==2.7.0",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.1",
  "types-PyYAML==6.0.12.20260518",
]

[tool.setuptools.packages.find]
include = ["backend*", "frontend*", "scripts*"]

[tool.setuptools.package-data]
backend = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["backend", "scripts", "tests"]
plugins = ["pydantic.mypy"]
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
exclude = ['^build/', '^dist/', '^\.venv/']

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
markers = [
  "integration: requires the locally bootstrapped Chinook dataset",
  "postgres: requires an explicitly configured PostgreSQL integration database",
  "evaluation: runs deterministic versioned evaluation catalogs",
  "ui: exercises the local Streamlit application",
  "docker: requires a healthy local Docker and Compose engine",
]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=backend",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]

[tool.coverage.run]
branch = true
source = ["backend"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
